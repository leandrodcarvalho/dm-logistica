# Gera um APK de teste (Android) e publica na release "android-teste".
# Baixe pelo celular em: https://github.com/<dono>/<repo>/releases/tag/android-teste
name: APK Android de teste

on:
  push:
    branches: [main]
    paths: ["app/**", "capacitor.config.json", "assets/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor e criar projeto Android
        run: |
          npm i @capacitor/core@latest @capacitor/android@latest
          npm i -D @capacitor/cli@latest @capacitor/assets
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1f1b2e' --splashBackgroundColor '#1f1b2e'
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../DM-Logistic.apk

      - name: Publicar na release android-teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-teste -y --cleanup-tag || true
          gh release create android-teste DM-Logistic.apk \
            --prerelease \
            --title "APK de teste — Android" \
            --notes "Versão de teste gerada automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o DM-Logistic.apk no celular Android e instale (permita 'instalar apps desconhecidos')."

      - uses: actions/upload-artifact@v4
        with:
          name: DM-Logistic-apk
          path: DM-Logistic.apk
